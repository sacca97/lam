name: release

# scripts/release.sh builds lam locally and puts the executables under release/
# in the commit a tag points at. Pushing that tag creates the GitHub release with
# lam-<os>-<arch> for each platform; GitHub adds the source tarball and records a
# SHA-256 digest per asset, which `lam update` and install.sh check. Nothing is
# compiled here.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          gh release create "${{ github.ref_name }}" release/lam-* \
            --title "lam ${{ github.ref_name }}" --generate-notes --verify-tag
